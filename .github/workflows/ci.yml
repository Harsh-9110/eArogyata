name: Verify application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B --no-transfer-progress verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/generated.ts backend/src/main/resources/static/openapi.json
      - run: python3 scripts/check-project.py
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dev-setup.py --demo
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up --wait -d
      - run: python3 scripts/security-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-security-probes
          path: results/security-probe.json
      - run: docker compose logs --no-color api > /tmp/api.log
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-startup-log
          path: /tmp/api.log
      - run: docker compose down
        if: always()
